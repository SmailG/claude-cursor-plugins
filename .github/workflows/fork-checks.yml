name: Fork checks

# Fork-only: upstream has no such workflow, so a sync never overwrites this file. Sync PRs are
# opened with GITHUB_TOKEN and trigger no workflows; sync-upstream.yml runs the same checks
# itself before it pushes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/**"
      - "*/agents/**"
      - "*/.claude-plugin/**"
      - "*/.cursor-plugin/**"
      - ".claude-plugin/**"
      - ".github/workflows/fork-checks.yml"

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Test the agent converter
        run: node --test scripts/claude-agents.test.mjs

      - name: Generated agents and manifests are current
        run: |
          node scripts/sync-manifests.mjs
          git add -A -N
          git diff --exit-code
