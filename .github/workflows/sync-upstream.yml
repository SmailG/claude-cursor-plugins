name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Without this, `gh` resolves the target repo from git remotes and
      # prefers a remote named "upstream" over "origin" — since this job
      # adds an `upstream` remote pointing at cursor/plugins, every
      # unscoped `gh` call below would otherwise silently target that
      # repo (where this token has no access) instead of this fork.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # The steps below run upstream's scripts; only the push and PR steps get a token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.editor true

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          BASE_SHA=""
          if [ -f .claude-plugin/.upstream-base ]; then
            BASE_SHA=$(tr -d '[:space:]' < .claude-plugin/.upstream-base)
          fi
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM_SHA" = "$BASE_SHA" ]; then
            echo "No upstream changes. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream moved: ${BASE_SHA:-<first-run>} → $UPSTREAM_SHA"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute branch name
        if: steps.check.outputs.changed == 'true'
        id: branch
        env:
          BASE_SHA: ${{ steps.check.outputs.base_sha }}
        run: |
          HEAD_TITLE=$(git log -1 --format="%s" upstream/main)
          SLUG=$(printf '%s' "$HEAD_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//' \
            | cut -c1-60)

          if [ -n "$BASE_SHA" ]; then
            COUNT=$(git log --oneline "${BASE_SHA}..upstream/main" | wc -l | tr -d '[:space:]')
          else
            COUNT=1
          fi

          if [ "$COUNT" -gt 1 ]; then
            SLUG="${SLUG}-${COUNT}-commits"
          fi

          echo "branch=sync/$SLUG" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # Write pr_title via printf to safely handle special characters
          printf 'pr_title=chore: sync with cursor/plugins — %s\n' "$HEAD_TITLE" >> "$GITHUB_OUTPUT"

      - name: Create sync branch and merge upstream
        if: steps.check.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"

          # Merge (not rebase) so this branch stays a fast-forward-friendly
          # descendant of main. Rebasing here rewrites main's own commits
          # onto a new upstream tip, which desyncs their ancestry from main
          # and makes the resulting PR unmergeable the moment main has any
          # commit that didn't come from a previous sync (see #3).
          set +e
          git merge --no-edit upstream/main
          MERGE_EXIT=$?
          set -e

          if [ "$MERGE_EXIT" -ne 0 ]; then
            if [ -f .git/MERGE_HEAD ]; then
              # Fork-generated files: keep our version. The "Sync manifests"
              # and "Rebuild README" steps below regenerate both from the
              # merged tree. Upstream now ships its own
              # .claude-plugin/marketplace.json, so taking theirs would rename
              # the marketplace and drop every other plugin, and rebuilding
              # README.md before this conflict is resolved crashes on the
              # conflict markers.
              for f in .claude-plugin/marketplace.json README.md; do
                if git diff --name-only --diff-filter=U | grep -qxF "$f"; then
                  echo "  resolving conflict (ours, regenerated below): $f"
                  git checkout --ours "$f"
                  git add "$f"
                fi
              done

              # All other conflicts: upstream wins
              git diff --name-only --diff-filter=U | while IFS= read -r f; do
                echo "  resolving conflict (upstream): $f"
                git checkout --theirs "$f"
                git add "$f"
              done

              git commit --no-edit
            else
              echo "Merge failed in unexpected state"
              exit 1
            fi
          fi

      - name: Sync manifests
        if: steps.check.outputs.changed == 'true'
        run: node scripts/sync-manifests.mjs

      - name: Rebuild README
        if: steps.check.outputs.changed == 'true'
        run: node scripts/rebuild-readme.mjs

      - name: Update upstream base SHA
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
        run: printf '%s\n' "$UPSTREAM_SHA" > .claude-plugin/.upstream-base

      - name: Amend sync commit
        if: steps.check.outputs.changed == 'true'
        run: git add -A && git commit --amend --no-edit

      # Sync PRs auto-merge and trigger no workflows, so this is the only check on them.
      - name: Check fork scripts against the merged tree
        if: steps.check.outputs.changed == 'true'
        run: |
          node --test scripts/claude-agents.test.mjs
          npm install --no-save --silent ajv ajv-formats
          node scripts/validate-plugins.mjs
          if [ -f scripts/generate-pstack-harness-trees.mjs ]; then
            node scripts/generate-pstack-harness-trees.mjs --check
          fi

      # GITHUB_TOKEN cannot push commits that touch .github/workflows, and "workflows" is not a
      # permission it can be granted. SYNC_TOKEN is an optional fine-grained token for this repo
      # with Contents, Pull requests and Workflows set to read and write; give it an expiry.
      # Earlier steps in this job ran upstream code, which could still reach this step through the
      # runner (GITHUB_ENV, PATH). That grants nothing upstream lacks: its content lands on main
      # through this unattended sync anyway. Hooks are disabled for the push all the same.
      - name: Push sync branch
        if: steps.check.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          if [ -z "$SYNC_TOKEN" ] && [ -n "$(git log --full-history --format= --name-only origin/main..HEAD -- .github/workflows)" ]; then
            echo "::error::This sync carries commits that change .github/workflows, which GITHUB_TOKEN cannot push. Add a SYNC_TOKEN secret: a fine-grained token for this repo with Contents, Pull requests and Workflows set to read and write."
            exit 1
          fi
          AUTH=$(printf 'x-access-token:%s' "${SYNC_TOKEN:-$GITHUB_TOKEN_FALLBACK}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force-with-lease origin "$BRANCH"

      - name: Ensure sync label exists
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create sync \
            --color 0075ca \
            --description "Automated upstream sync" \
            --force

      - name: Close stale sync PRs
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list \
            --label sync \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/")) | .number' \
            | xargs -r -I{} gh pr close {} \
              --comment "Superseded by newer sync PR." \
          || true

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          PR_TITLE: ${{ steps.branch.outputs.pr_title }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          BASE_SHA: ${{ steps.check.outputs.base_sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            COMMIT_LOG=$(git log --oneline "${BASE_SHA}..upstream/main")
          else
            COMMIT_LOG=$(git log --oneline upstream/main | head -10)
          fi

          {
            printf '## Upstream changes\n\n'
            printf '%s\n' "$COMMIT_LOG"
            printf '\n---\n'
            printf '_Automated sync via [sync-upstream workflow](.github/workflows/sync-upstream.yml)_\n'
          } > /tmp/pr-body.md

          gh pr create \
            --title "$PR_TITLE" \
            --body-file /tmp/pr-body.md \
            --label sync \
            --head "$BRANCH" \
            --base main \
          || true

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "::error::gh pr create failed and no pull request exists for $BRANCH — upstream sync did not land."
            exit 1
          fi

          # --merge, not --rebase: the branch contains a real merge commit
          # (from merging upstream/main above), and GitHub's rebase-merge
          # refuses branches with merge commits.
          gh pr merge --auto --merge \
            --subject "$PR_TITLE" \
          || echo "::warning::Could not enable auto-merge for $BRANCH. Check that 'Allow auto-merge' is enabled in repo settings, then merge the PR manually."

      - name: Summary
        if: steps.check.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          COUNT: ${{ steps.branch.outputs.count }}
        run: |
          {
            echo "### Sync PR created"
            echo "- **Branch:** $BRANCH"
            echo "- **Upstream SHA:** $UPSTREAM_SHA"
            echo "- **Commits synced:** $COUNT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close failure report
        if: success() && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label sync-failed --state open --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --comment "Sync succeeded: $RUN_URL"

      # Sync PRs merge unattended, so a failed run has to say so somewhere a person will see.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create sync-failed --color d73a4a --description "Upstream sync failed" --force
          ISSUE=$(gh issue list --label sync-failed --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Upstream sync is failing" --label sync-failed \
              --body "The sync-upstream workflow failed: $RUN_URL. Close this issue once a sync succeeds."
          fi
